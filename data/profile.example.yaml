  - id: proj-doctortracker
    kind: project
    text: "Doctor Tracker, a clinic register replacing a practice's spreadsheets: an admin portal for doctors and the patients each one tracks, deployed on Vercel and Render against MongoDB Atlas"
    source: github/Mayamoho/doctor-tracker-web
    org: Mayamoho/doctor-tracker
    period: "2026"
    skills: ["full stack", MongoDB, TypeScript, "REST API", "access control"]
  - id: proj-doctortracker-api
    kind: project
    text: "Built the Express 5 and Mongoose 9 REST API in TypeScript: JWT sessions carried in httpOnly access and refresh cookies, a dashboard aggregated in one $facet pass, and free-text search over a normalized searchTerms array with an anchored prefix match instead of $regex on raw strings"
    source: github/Mayamoho/doctor-tracker-api
    skills: [Express, Mongoose, MongoDB, JWT, TypeScript, "query indexes", "aggregation pipeline"]
    metrics: { node: "20.19", body_limit_kb: "16" }
  - id: proj-doctortracker-security
    kind: project
    text: "Held the token out of JavaScript entirely behind one admin role, with requireAuth and requireRole guards; zod parses every parameter before it reaches Mongo, $regex input is escaped, /auth/* is limited to 10 requests per 15 minutes and the API to 120 per minute, an unknown account and a wrong password answer identically, and production refuses to boot on the seeded development credentials"
    source: github/Mayamoho/doctor-tracker-api
    skills: ["rate limiting", zod, "input validation", "authentication", "enumeration resistance", "httpOnly cookies"]
    metrics: { auth_rate_limit: "10 per 15 minutes", api_rate_limit: "120 per minute" }
  - id: proj-doctortracker-data
    kind: project
    text: "Sourced 72 real doctors with names, degrees, BMDC registration numbers, specialization and institution copied from public Bangladeshi doctor directories with the source recorded per row, leaving phone and email as the literal string 'not published'; 600 patient records are synthetic, while districts, divisions and condition names with ICD-10 codes come from the DGHS facility registry and a per-specialty reference catalogue"
    source: github/Mayamoho/doctor-tracker-api
    skills: [MongoDB, "data provenance", "reference data", "ICD-10", DGHS]
    metrics: { doctors: "72", patients: "600" }
  - id: proj-doctortracker-portal
    kind: project
    text: "Built the Next.js 16 App Router portal on React 19 with TanStack Query 5, Recharts 3 and Tailwind CSS 4: filters for specialization, hospital, district, condition, gender and severity, server-whitelisted sorting on 8 register columns and 7 patient columns, pagination held in the URL so a reloaded or shared link survives, and case-mix and weekly and monthly visit counts on the dashboard"
    source: github/Mayamoho/doctor-tracker-web
    skills: ["Next.js", React, "TanStack Query", Recharts, Tailwind, zod, TypeScript]
