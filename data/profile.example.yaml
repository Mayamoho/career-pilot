# De-identified fact base — safe to commit, because CI and the eval thresholds need a
# profile and this one has no phone number or address in it.
#
# The real file is data/profile.yaml: identical atoms, plus contact details, and it is
# gitignored. `careerpilot` prefers the real one whenever it exists.
#
# Every bullet in every tailored CV must be traceable to one of these atoms.
# Keep it factual and keep the numbers exact: `metrics` and the digits inside
# `text` are what the groundedness gate allows a generated bullet to claim.
# Fill in the LinkedIn link still marked TODO; nothing else is invented downstream.

