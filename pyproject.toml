[project]
name = "careerpilot"
version = "0.1.0"
description = "Grounded job-search agent: scores fit and tailors your CV, with a code-enforced guarantee that every line traces to real experience."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "typer>=0.15,<1",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
careerpilot = "careerpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ARG", "PTH", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# A test that spells out the number it expects is stating the contract, not a magic
# constant; production code still has to name its thresholds.
"tests/*" = ["PLR2004", "PLW0108"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src:tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "eval: runs the evaluation suite and enforces quality thresholds",
    "live: hits real provider APIs — nightly only, skipped without credentials",
]

[tool.coverage.run]
source = ["src/careerpilot"]
branch = true
